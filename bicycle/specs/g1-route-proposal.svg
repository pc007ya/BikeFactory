<rect x="35" y="395" width="130" height="110" rx="10" fill="#e9eef6" stroke="#bac7d3"/>
<text x="47" y="418" class="label">有限外部料源</text>
<text x="47" y="442" class="tiny">補料推車×1</text>
<text x="47" y="464" class="tiny">由H0取料</text>
<text x="47" y="486" class="tiny">空車返源才釋放</text>
<rect x="35" y="790" width="1330" height="225" rx="10" fill="#ffffff" stroke="#bac7d3"/>
<text x="55" y="821" class="label">圖與邏輯必須共用節點／邊資料；線條不是裝飾動線。</text>
<text x="55" y="853" class="tiny">藍：人行＋有人補料推車。每段容量1、雙向共鎖；整趟原子預約；未取得路權在PW/AW/QW等候。</text>
<text x="55" y="879" class="tiny">青：單台V1的空載／載貨網。每段容量1；全路線預約；裝卸各6秒；沒有多車避碰的驗收主張。</text>
<text x="55" y="905" class="tiny">橘：物流端口與站內搬移互鎖。人員操作側與AGV物流側分離；維護進入則停止該端口裝卸。</text>
<text x="55" y="931" class="tiny">FG／報廢終端均有限容量6，清空Q-G/Q-S的是V1；滿載就明確阻塞，不自動移除貨物。</text>
<text x="55" y="957" class="tiny">所有工時、尺寸、寬度、數量與座標僅為提案假設；未做通道淨寬、設備包絡、人體工學或職安驗證。</text>
